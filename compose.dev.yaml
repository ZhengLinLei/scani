name: scani-dev

services:
  app:
    image: scani:dev
    build:
      context: .
      target: development
    init: true
    environment:
      HOST: 0.0.0.0
      PORT: '3000'
      DATA_DIR: /app/data
      TRUST_PROXY: '1'
      OCR_LANGUAGES: ${OCR_LANGUAGES:-eng+spa}
      OCR_LANG_PATH: ${OCR_LANG_PATH:-}
      OCR_MAX_WIDTH: ${OCR_MAX_WIDTH:-2200}
      OCR_MIN_CONFIDENCE: ${OCR_MIN_CONFIDENCE:-45}
    ports:
      - '127.0.0.1:${SCANI_DEV_PORT:-4200}:4200'
    volumes:
      - ./frontend:/app/frontend:ro
      - ./server:/app/server:ro
      - scans:/app/data
      - angular-cache:/app/.angular
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - >-
          Promise.all([
            fetch('http://127.0.0.1:3000/api/health'),
            fetch('http://127.0.0.1:4200/')
          ])
            .then(responses => { if (responses.some(response => !response.ok)) process.exit(1); })
            .catch(() => process.exit(1));
      interval: 5s
      timeout: 3s
      start_period: 30s
      retries: 24
  caddy:
    image: caddy:2-alpine
    depends_on:
      app:
        condition: service_healthy
    environment:
      SCANI_ADDRESS: ${SCANI_ADDRESS:-localhost}
      SCANI_HTTPS_PORT: ${SCANI_DEV_HTTPS_PORT:-8443}
      SCANI_UPSTREAM: app:4200
    ports:
      - '${SCANI_DEV_HTTPS_PORT:-8443}:${SCANI_DEV_HTTPS_PORT:-8443}/tcp'
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
volumes:
  scans:
  angular-cache:
  caddy-data:
  caddy-config:
